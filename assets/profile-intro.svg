<svg width="1000" height="350" viewBox="0 0 1000 350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joalesf animated profile introduction</title>
  <desc id="desc">Animated profile introduction text for Joalesf.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .title { fill: #e5edf6; font-size: 28px; font-weight: 700; }
    .subtitle { fill: #cbd5e1; font-size: 18px; font-weight: 400; }
    .section { fill: #e5edf6; font-size: 24px; font-weight: 700; }
    .body { fill: #dbe7f3; font-size: 17px; font-weight: 400; }
    .bullet { fill: #dbe7f3; font-size: 16px; font-weight: 400; }
    .accent { fill: #2dd4bf; }
  </style>

  <g opacity="0">
    <text x="0" y="34" class="title">Hi, I'm Joalesf</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.8s" begin="0s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="0" y="74" class="subtitle">Senior Software Developer focused on automation, integrations, networks, AI workflows, and practical software solutions.</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.8s" begin="0.35s" fill="freeze"/>
  </g>

  <g opacity="0">
    <line x1="0" y1="102" x2="1000" y2="102" stroke="#263548" stroke-width="1"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.65s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="0" y="146" class="section">Focused On</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.75s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.8s" begin="0.75s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="0" y="186" class="body">I design software solutions that connect systems, automate processes, and move data clearly across platforms.</text>
    <text x="0" y="212" class="body">My work brings together development, databases, network protocols, MQTT, dashboards, web camera integrations,</text>
    <text x="0" y="238" class="body">and Industry 4.0 connectivity.</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.8s" begin="1.1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <circle cx="7" cy="272" r="4" class="accent"/>
    <text x="24" y="277" class="bullet">Building automation workflows, dashboards, and connected systems.</text>
    <circle cx="7" cy="298" r="4" class="accent"/>
    <text x="24" y="303" class="bullet">Improving software architecture, integrations, and data flows.</text>
    <circle cx="7" cy="324" r="4" class="accent"/>
    <text x="24" y="329" class="bullet">Creating reliable solutions for real technical environments.</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.8s" begin="1.45s" fill="freeze"/>
  </g>
</svg>
