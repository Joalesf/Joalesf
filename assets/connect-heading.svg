<svg width="1000" height="56" viewBox="0 0 1000 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Connect With Me">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #e5edf6; font-size: 24px; font-weight: 700; }
  </style>
  <g opacity="0">
    <text x="0" y="36">Connect With Me</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
