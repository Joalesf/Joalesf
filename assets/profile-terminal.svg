<svg width="1000" height="320" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joalesf technical profile terminal card</title>
  <desc id="desc">A dark terminal style profile card with animated scan effects, contribution blocks, and software automation text.</desc>
  <style>
    .terminal { animation: fadeIn .9s ease-out both; }
    .panel { fill: #07111f; stroke: #1f3b57; stroke-width: 1; }
    .muted { fill: #7dd3fc; font: 500 13px Consolas, Monaco, monospace; opacity: .76; }
    .label { fill: #e5edf6; font: 700 17px Consolas, Monaco, monospace; }
    .line { fill: #b7c7d9; font: 500 14px Consolas, Monaco, monospace; }
    .accent { fill: #2dd4bf; }
    .soft { fill: #60a5fa; }
    .glow { filter: drop-shadow(0 0 7px rgba(45, 212, 191, .58)); }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    .scan { animation: scan 4.8s ease-in-out infinite; opacity: .42; }
    .cell { animation: pulse 3.8s ease-in-out infinite; }
    .reveal { opacity: 0; transform: translateY(8px); animation: reveal .75s ease-out both; }
    .r1 { animation-delay: .25s; }
    .r2 { animation-delay: .55s; }
    .r3 { animation-delay: .85s; }
    .r4 { animation-delay: 1.15s; }
    .r5 { animation-delay: 1.45s; }
    .cell:nth-of-type(3n) { animation-delay: .35s; }
    .cell:nth-of-type(4n) { animation-delay: .85s; }
    .cell:nth-of-type(5n) { animation-delay: 1.25s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan {
      0% { transform: translateX(-190px); }
      50% { transform: translateX(1010px); }
      100% { transform: translateX(1010px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .42; }
      50% { opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(.985); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <rect width="1000" height="320" rx="10" fill="#050b14"/>

  <g class="terminal">
    <rect x="38" y="32" width="924" height="256" rx="12" class="panel"/>
    <rect x="38" y="32" width="924" height="34" rx="12" fill="#0b1628"/>
    <circle cx="62" cy="49" r="5" fill="#ef4444"/>
    <circle cx="80" cy="49" r="5" fill="#f59e0b"/>
    <circle cx="98" cy="49" r="5" fill="#22c55e"/>
    <text x="124" y="54" class="muted reveal r1">joalesf@github:~/profile</text>

    <text x="64" y="98" class="label reveal r2">software / automation / networks</text>
    <text x="64" y="128" class="line reveal r3"><tspan class="accent">$</tspan> build --systems --data-flow --integrations</text>
    <text x="64" y="154" class="line reveal r4">status: <tspan class="accent">online</tspan> | stack: C# .NET Java Kotlin React Node.js</text>
    <text x="64" y="180" class="line reveal r5">protocols: MQTT SQL Docker AI workflows Industry 4.0</text>
    <rect x="64" y="198" width="11" height="18" rx="2" class="accent cursor"/>

