  <text x="64" y="98" class="label">software / automation / networks</text>
  <text x="64" y="128" class="line"><tspan class="accent">$</tspan> build --systems --data-flow --integrations</text>
  <text x="64" y="154" class="line">status: <tspan class="accent">online</tspan> | stack: C# .NET Java Kotlin React Node.js</text>
  <text x="64" y="180" class="line">protocols: MQTT SQL Docker AI workflows Industry 4.0</text>
