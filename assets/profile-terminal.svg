<svg width="1000" height="320" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joalesf technical profile terminal card</title>
  <desc id="desc">A dark terminal style profile card with animated scan effects, contribution blocks, and software automation text.</desc>
  <style>
    .panel { fill: #07111f; stroke: #1f3b57; stroke-width: 1; }
    .muted { fill: #7dd3fc; font: 500 13px Consolas, Monaco, monospace; opacity: .76; }
    .label { fill: #e5edf6; font: 700 17px Consolas, Monaco, monospace; }
    .line { fill: #b7c7d9; font: 500 14px Consolas, Monaco, monospace; }
    .accent { fill: #2dd4bf; }
    .soft { fill: #60a5fa; }
    .glow { filter: drop-shadow(0 0 7px rgba(45, 212, 191, .58)); }
    .scan { opacity: .42; }
    .cell { animation: pulse 3.8s ease-in-out infinite; }
    .cell:nth-of-type(3n) { animation-delay: .35s; }
    .cell:nth-of-type(4n) { animation-delay: .85s; }
    .cell:nth-of-type(5n) { animation-delay: 1.25s; }
    @keyframes pulse {
      0%, 100% { opacity: .42; }
      50% { opacity: 1; }
    }
  </style>

  <rect width="1000" height="320" rx="10" fill="#050b14"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" from="0.985" to="1" dur="0.9s" begin="0s" fill="freeze"/>
    <rect x="38" y="32" width="924" height="256" rx="12" class="panel"/>
    <rect x="38" y="32" width="924" height="34" rx="12" fill="#0b1628"/>
    <circle cx="62" cy="49" r="5" fill="#ef4444"/>
    <circle cx="80" cy="49" r="5" fill="#f59e0b"/>
    <circle cx="98" cy="49" r="5" fill="#22c55e"/>
    <text x="124" y="54" class="muted" opacity="0">joalesf@github:~/profile
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.25s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.7s" begin="0.25s" fill="freeze"/>
    </text>

    <text x="64" y="98" class="label" opacity="0">joalesf@workspace: run automation stack
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.55s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.7s" begin="0.55s" fill="freeze"/>
    </text>
    <text x="64" y="128" class="line" opacity="0"><tspan class="accent">$</tspan> n8n execute --workflow industrial-data-flow
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.85s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.7s" begin="0.85s" fill="freeze"/>
    </text>
    <text x="64" y="154" class="line" opacity="0"><tspan class="soft">></tspan> MQTT broker connected -> SQL stream normalized
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.7s" begin="1.15s" fill="freeze"/>
    </text>
    <text x="64" y="180" class="line" opacity="0"><tspan class="accent">$</tspan> dotnet run --project dashboard.api
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.45s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.7s" begin="1.45s" fill="freeze"/>
    </text>
    <rect x="64" y="198" width="11" height="18" rx="2" class="accent">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

