    <text x="554" y="208" class="muted" opacity="0">runtime output
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.85s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.7s" begin="0.85s" fill="freeze"/>
