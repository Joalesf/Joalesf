<svg width="1000" height="320" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joalesf animated terminal</title>
  <desc id="desc">A terminal window that continuously types commands and runtime output for automation, dashboards, MQTT, SQL, and integrations.</desc>
  <style>
    .bg { fill: #050b14; }
    .panel { fill: #07111f; stroke: #1f3b57; stroke-width: 1; }
    .bar { fill: #0b1628; }
    .prompt { fill: #2dd4bf; font: 700 15px Consolas, Monaco, monospace; }
    .cmd { fill: #e5edf6; font: 600 15px Consolas, Monaco, monospace; }
    .out { fill: #93c5fd; font: 500 14px Consolas, Monaco, monospace; }
    .muted { fill: #7dd3fc; font: 500 13px Consolas, Monaco, monospace; opacity: .82; }
    .ok { fill: #2dd4bf; font: 700 14px Consolas, Monaco, monospace; }
    .cursor { fill: #2dd4bf; }
    .tile { filter: drop-shadow(0 0 6px rgba(45, 212, 191, .4)); }
  </style>

  <defs>
    <clipPath id="line1"><rect x="64" y="86" width="0" height="24"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;276;276;0" keyTimes="0;.03;.13;.92;1"/></rect></clipPath>
    <clipPath id="line2"><rect x="64" y="112" width="0" height="24"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;316;316;0" keyTimes="0;.14;.23;.92;1"/></rect></clipPath>
