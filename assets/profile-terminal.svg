    <clipPath id="line6"><rect x="64" y="216" width="0" height="24"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;270;270;0" keyTimes="0;.55;.64;.92;1"/></rect></clipPath>
    <clipPath id="line7"><rect x="64" y="242" width="0" height="24"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;332;332;0" keyTimes="0;.65;.77;.92;1"/></rect></clipPath>
