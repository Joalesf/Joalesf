<svg width="1000" height="610" viewBox="0 0 1000 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joalesf profile hero</title>
  <desc id="desc">Animated profile introduction and terminal-style technology panel.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .title { fill: #e5edf6; font-size: 28px; font-weight: 700; }
    .subtitle { fill: #cbd5e1; font-size: 18px; font-weight: 400; }
    .section { fill: #e5edf6; font-size: 24px; font-weight: 700; }
    .body { fill: #dbe7f3; font-size: 17px; font-weight: 400; }
    .bullet { fill: #dbe7f3; font-size: 16px; font-weight: 400; }
    .terminal-title { fill: #e5edf6; font: 700 17px Consolas, Monaco, monospace; }
    .terminal-line { fill: #b7c7d9; font: 500 14px Consolas, Monaco, monospace; }
    .terminal-muted { fill: #7dd3fc; font: 500 13px Consolas, Monaco, monospace; opacity: .82; }
    .accent { fill: #2dd4bf; }
    .soft { fill: #60a5fa; }
    .panel { fill: #07111f; stroke: #1f3b57; stroke-width: 1; }
  </style>

  <defs>
    <clipPath id="clip-title"><rect x="0" y="0" width="0" height="42"><animate attributeName="width" from="0" to="265" dur="0.85s" begin="0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-subtitle"><rect x="0" y="45" width="0" height="42"><animate attributeName="width" from="0" to="930" dur="1.25s" begin="0.75s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-focused"><rect x="0" y="105" width="0" height="36"><animate attributeName="width" from="0" to="170" dur="0.65s" begin="2s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-body"><rect x="0" y="142" width="0" height="86"><animate attributeName="width" from="0" to="970" dur="1.35s" begin="2.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-bullets"><rect x="0" y="232" width="0" height="76"><animate attributeName="width" from="0" to="980" dur="1.2s" begin="3.75s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-terminal-head"><rect x="64" y="354" width="0" height="28"><animate attributeName="width" from="0" to="300" dur="0.65s" begin="5.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-terminal-1"><rect x="64" y="386" width="0" height="24"><animate attributeName="width" from="0" to="390" dur="0.85s" begin="6.25s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-terminal-2"><rect x="64" y="412" width="0" height="24"><animate attributeName="width" from="0" to="470" dur="0.9s" begin="6.95s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-terminal-3"><rect x="64" y="438" width="0" height="24"><animate attributeName="width" from="0" to="440" dur="0.85s" begin="7.65s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip-pipeline"><rect x="554" y="460" width="0" height="86"><animate attributeName="width" from="0" to="360" dur="1s" begin="8.15s" fill="freeze"/></rect></clipPath>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clip-title)">
    <text x="0" y="34" class="title">Hi, I'm Joalesf</text>
  </g>

  <g clip-path="url(#clip-subtitle)">
    <text x="0" y="74" class="subtitle">Senior Software Developer focused on automation, integrations, networks, AI workflows, and practical software solutions.</text>
  </g>

  <g clip-path="url(#clip-focused)">
    <text x="0" y="126" class="section">Focused On</text>
  </g>

  <g clip-path="url(#clip-body)">
    <text x="0" y="166" class="body">I design software solutions that connect systems, automate processes, and move data clearly across platforms.</text>
    <text x="0" y="192" class="body">My work brings together development, databases, network protocols, MQTT, dashboards, web camera integrations,</text>
    <text x="0" y="218" class="body">and Industry 4.0 connectivity.</text>
  </g>

  <g clip-path="url(#clip-bullets)">
    <circle cx="7" cy="252" r="4" class="accent"/>
    <text x="24" y="257" class="bullet">Building automation workflows, dashboards, and connected systems.</text>
    <circle cx="7" cy="278" r="4" class="accent"/>
    <text x="24" y="283" class="bullet">Improving software architecture, integrations, and data flows.</text>
    <circle cx="540" cy="278" r="4" class="accent"/>
    <text x="557" y="283" class="bullet">Creating reliable solutions for real technical environments.</text>
  </g>

