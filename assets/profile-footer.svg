<svg width="1000" height="42" viewBox="0 0 1000 42" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thanks for visiting my profile. This space will keep growing along with my projects.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #cbd5e1; font-size: 16px; font-weight: 400; }
  </style>
  <g opacity="0">
    <text x="500" y="27" text-anchor="middle">Thanks for visiting my profile. This space will keep growing along with my projects.</text>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;.35;1" dur="2.2s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0" keyTimes="0;.35;1" dur="2.2s" begin="0s" fill="freeze"/>
  </g>
</svg>
